# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check webhook secret
        # The injection step below cannot tell an unset secret from a valid one -
        # it happily writes an empty string, the deploy reports success, and the
        # live form silently answers "unavailable" for every visitor. Fail here
        # instead, before anything is published.
        run: |
          # Pasting into the secret textarea easily picks up a trailing newline,
          # which would survive the glob below and end up escaped as \n inside
          # the emitted JS string. Validate the trimmed value.
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '[:space:]')"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::LOAN_APPLICATION_WEBHOOK_URL is unset or empty. Set it under Settings > Secrets and variables > Actions, then re-run. Refusing to deploy a form that cannot submit."
            exit 1
          fi
          case "$WEBHOOK_URL" in
            https://*/webhook/*) ;;
            https://*/webhook-test/*)
              echo "::error::LOAN_APPLICATION_WEBHOOK_URL points at an n8n test path (/webhook-test/), which only answers one call after you press Execute workflow. Use the production /webhook/ URL."
              exit 1
              ;;
            *)
              echo "::error::LOAN_APPLICATION_WEBHOOK_URL does not look like an n8n production webhook (expected https://.../webhook/...)."
              exit 1
              ;;
          esac
        env:
          WEBHOOK_URL: ${{ secrets.LOAN_APPLICATION_WEBHOOK_URL }}
      - name: Inject webhook URL
        # Writes the real webhook address into config.js at deploy time, so it
        # never lives in the (public) repo. Set the secret under
        # Settings > Secrets and variables > Actions > LOAN_APPLICATION_WEBHOOK_URL.
        # The "Check webhook secret" step above guarantees a sane value by here.
        # .strip() drops any stray whitespace so it cannot land inside the URL.
        run: |
          printf 'export const WEBHOOK_URL = %s;\n' \
            "$(printf '%s' "$WEBHOOK_URL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')" \
            > assets/js/config.js
        env:
          WEBHOOK_URL: ${{ secrets.LOAN_APPLICATION_WEBHOOK_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
