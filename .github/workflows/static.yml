# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject webhook URL
        # Writes the real webhook address into config.js at deploy time, so it
        # never lives in the (public) repo. Set the secret under
        # Settings > Secrets and variables > Actions > LOAN_APPLICATION_WEBHOOK_URL.
        # If the secret is unset the file keeps its empty default and the form
        # shows a friendly "unavailable" message instead of failing silently.
        run: |
          printf 'export const WEBHOOK_URL = %s;\n' \
            "$(printf '%s' "$WEBHOOK_URL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            > assets/js/config.js
        env:
          WEBHOOK_URL: ${{ secrets.LOAN_APPLICATION_WEBHOOK_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
